backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

# JSON format so Vite can import the files directly
format: json

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "public/content/projects"
    create: true
    delete: true
    slug: "{{id}}"
    format: json
    extension: json
    identifier_field: id
    fields:
      - { label: "ID (slug, no spaces)", name: "id", widget: "string", hint: "e.g. poster-dirt — used as filename, don't change after creating" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Visual Identity", value: "visual-identity" }
          - { label: "Logotypes", value: "logotypes" }
          - { label: "Posters", value: "posters" }
          - { label: "Album Covers", value: "album-covers" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", hint: "Short line on the grid card, e.g. 'Poster Design'" }
      - { label: "Thumbnail (grid image)", name: "thumbnail", widget: "image" }
      - { label: "Full image (modal)", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
